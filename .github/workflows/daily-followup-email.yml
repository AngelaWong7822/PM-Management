name: Daily follow-up email

on:
  schedule:
    # 00:00-02:45 UTC = 08:00-10:45 香港時間 (全年冇 DST，唔使調)，每15分鐘check一次
    # GitHub scheduled workflow 有時會delay幾個鐘甚至被skip，所以用一個時間窗
    # 嚟頂，script入面會check today有冇寄過，寄咗就即刻skip，唔會重複寄
    - cron: "*/15 0-2 * * *"
  workflow_dispatch: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --omit=dev

      - run: npm run send-email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
